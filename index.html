<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFY Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 15px; }
        .header {
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .balance { font-size: 28px; font-weight: bold; color: #ffd700; margin: 10px 0; }
        .vip { font-size: 14px; opacity: 0.9; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .card:hover { background: rgba(255,255,255,0.25); }
        .card:active { transform: scale(0.95); }
        .icon { font-size: 32px; }
        .title { font-size: 14px; margin: 5px 0; }
        .value { font-size: 18px; color: #ffd700; font-weight: bold; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin: 8px 0;
            transition: all 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 25px;
            max-width: 360px;
            margin: 50px auto;
            color: white;
            position: relative;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #aaa;
        }
        h2 { text-align: center; margin-bottom: 20px; font-size: 22px; }
        .info { text-align: center; margin: 15px 0; font-size: 14px; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 15px 0; }
        .tile {
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tile:active { transform: scale(0.95); }
        .tile.opened { background: #4ade80; }
        .tile.bomb { background: #ff4444; }
        .farm-list { margin: 15px 0; }
        .farm-item {
            background: rgba(0,255,100,0.15);
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lb-list { max-height: 300px; overflow-y: auto; }
        .lb-item {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat { background: rgba(255,255,255,0.1); padding: 12px; text-align: center; border-radius: 8px; }
        .btn-sm { width: auto; padding: 8px 16px; font-size: 12px; margin: 0 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 TFY CASINO</h1>
            <div class="balance" id="bal">💎 1,000 TFY</div>
            <div class="vip" id="vipStatus">🟢 Бронза</div>
        </div>

        <div class="grid">
            <div class="card" id="minesCard">
                <div class="icon">🧨</div>
                <div class="title">MINES</div>
                <div class="value" id="minesVal">x1.00</div>
            </div>
            <div class="card" id="farmCard">
                <div class="icon">🌿</div>
                <div class="title">FARM</div>
                <div class="value" id="farmVal">0 TFY</div>
            </div>
            <div class="card" id="miningCard">
                <div class="icon">⛏️</div>
                <div class="title">MINING</div>
                <div class="value" id="miningVal">0.01</div>
            </div>
            <div class="card" id="casesCard">
                <div class="icon">🎡</div>
                <div class="title">CASES</div>
                <div class="value" id="casesVal">100</div>
            </div>
        </div>

        <button class="btn" id="dailyBtn">📦 ДЕЙЛИ</button>
        <button class="btn" id="lbBtn">🏆 ЛИДЕРБОРД</button>
        <button class="btn" id="shopBtn">🛒 МАГАЗИН</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeBtn">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // STATE
        let state = {
            balance: parseInt(localStorage.getItem('balance')) || 1000,
            mines_opened: parseInt(localStorage.getItem('mines_opened')) || 0,
            mines_mult: parseFloat(localStorage.getItem('mines_mult')) || 1,
            farm_seeds: parseInt(localStorage.getItem('farm_seeds')) || 1,
            farm_plants: JSON.parse(localStorage.getItem('farm_plants')) || [],
            mining_power: parseFloat(localStorage.getItem('mining_power')) || 0.01,
            mining_energy: parseFloat(localStorage.getItem('mining_energy')) || 100,
            mining_lastTime: parseInt(localStorage.getItem('mining_lastTime')) || Date.now(),
            cases_spins: parseInt(localStorage.getItem('cases_spins')) || 0,
            stickers_c: parseInt(localStorage.getItem('stickers_c')) || 0,
            stickers_g: parseInt(localStorage.getItem('stickers_g')) || 0,
            stickers_d: parseInt(localStorage.getItem('stickers_d')) || 0,
            stickers_p: parseInt(localStorage.getItem('stickers_p')) || 0,
            daily_last: parseInt(localStorage.getItem('daily_last')) || 0,
            streak: parseInt(localStorage.getItem('streak')) || 1
        };

        // SAVE
        function save() {
            localStorage.setItem('balance', state.balance);
            localStorage.setItem('mines_opened', state.mines_opened);
            localStorage.setItem('mines_mult', state.mines_mult);
            localStorage.setItem('farm_seeds', state.farm_seeds);
            localStorage.setItem('farm_plants', JSON.stringify(state.farm_plants));
            localStorage.setItem('mining_power', state.mining_power);
            localStorage.setItem('mining_energy', state.mining_energy);
            localStorage.setItem('mining_lastTime', state.mining_lastTime);
            localStorage.setItem('cases_spins', state.cases_spins);
            localStorage.setItem('stickers_c', state.stickers_c);
            localStorage.setItem('stickers_g', state.stickers_g);
            localStorage.setItem('stickers_d', state.stickers_d);
            localStorage.setItem('stickers_p', state.stickers_p);
            localStorage.setItem('daily_last', state.daily_last);
            localStorage.setItem('streak', state.streak);
        }

        // UPDATE UI
        function update() {
            document.getElementById('bal').textContent = `💎 ${fmt(state.balance)} TFY`;
            document.getElementById('minesVal').textContent = `x${state.mines_mult.toFixed(2)}`;
            document.getElementById('casesVal').textContent = fmt(100 + state.cases_spins * 3.5);
            document.getElementById('miningVal').textContent = state.mining_power.toFixed(2);
            
            let farmTotal = state.farm_plants.reduce((a,p) => a + (p.gain || 0), 0) + state.mining_power * 1440;
            document.getElementById('farmVal').textContent = fmt(farmTotal);
            
            let stickers = state.stickers_c + state.stickers_g + state.stickers_d + state.stickers_p;
            let vip = '🟢 Бронза';
            if(stickers >= 50) vip = '🌈 Легенда';
            else if(stickers >= 20) vip = '🟣 Платина';
            else if(stickers >= 5) vip = '🟡 Золото';
            document.getElementById('vipStatus').textContent = vip;
        }

        // MINING LOOP
        setInterval(() => {
            let now = Date.now();
            let mins = (now - state.mining_lastTime) / 60000;
            if(mins > 0) {
                state.balance += state.mining_power * mins;
                state.mining_lastTime = now;
                save();
                update();
            }
        }, 1000);

        // MODAL
        function showModal(html) {
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // MINES
        function openMines() {
            let html = `
                <h2>🧨 MINES</h2>
                <div class="info">x${state.mines_mult.toFixed(2)} | ${state.mines_opened}/25</div>
                <div class="grid-5" id="minesGrid"></div>
                <button class="btn" id="mineBtn">ОТКРЫТЬ (-25 TFY)</button>
                <button class="btn" id="cashoutBtn" ${state.mines_opened === 0 ? 'disabled' : ''}>💰 CASH OUT</button>
            `;
            showModal(html);
            
            let grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for(let i = 0; i < 25; i++) {
                let t = document.createElement('div');
                t.className = i < state.mines_opened ? 'tile opened' : 'tile';
                t.textContent = i < state.mines_opened ? '💎' : '?';
                grid.appendChild(t);
            }
            
            document.getElementById('mineBtn').onclick = () => {
                if(state.balance < 25) { alert('Нужно 25 TFY'); return; }
                if(state.mines_opened >= 8) { alert('Слишком много!'); return; }
                
                state.balance -= 25;
                state.mines_opened++;
                state.mines_mult = 1 + state.mines_opened * 0.15;
                
                if(Math.random() < 0.25) {
                    alert('💥 МИНА!');
                    state.mines_opened = 0;
                    state.mines_mult = 1;
                } else {
                    if(Math.random() < 0.05) alert('🎫 КАРТА!');
                }
                
                save();
                update();
                openMines();
            };
            
            document.getElementById('cashoutBtn').onclick = () => {
                let win = Math.floor(state.mines_mult * 25);
                state.balance += win;
                alert(`💰 +${win} TFY`);
                state.mines_opened = 0;
                state.mines_mult = 1;
                save();
                update();
                closeModal();
            };
        }

        // FARM
        function openFarm() {
            let plantsHtml = state.farm_plants.map((p, i) => 
                `<div class="farm-item"><span>${p.emoji} +${p.gain}</span><button class="btn btn-sm" onclick="window.harvestPlant(${i})">Собрать</button></div>`
            ).join('') || '<div style="text-align:center; opacity:0.7;">Нет растений</div>';
            
            let html = `
                <h2>🌿 FARM</h2>
                <div class="info">Семечек: ${state.farm_seeds}/1
                    <button class="btn btn-sm" id="plantBtn" ${state.farm_seeds < 1 ? 'disabled' : ''}>Посадить</button>
                </div>
                <div class="farm-list">${plantsHtml}</div>
            `;
            showModal(html);
            
            document.getElementById('plantBtn').onclick = () => {
                if(state.farm_seeds < 1) return;
                state.farm_seeds = 0;
                state.farm_plants.push({ emoji: '🌿', gain: 50 });
                alert('🌱 Посажено!');
                save();
                update();
                openFarm();
            };
        }

        window.harvestPlant = function(i) {
            state.balance += state.farm_plants[i].gain;
            state.farm_plants.splice(i, 1);
            state.farm_seeds = 1;
            alert(`✅ +${state.farm_plants[i]?.gain || 50} TFY`);
            save();
            update();
            openFarm();
        };

        // MINING
        function openMining() {
            let html = `
                <h2>⛏️ MINING</h2>
                <div class="info">
                    <div>${state.mining_power.toFixed(2)} TFY/мин</div>
                    <div>Энергия: ${state.mining_energy.toFixed(0)}%</div>
                    <button class="btn" id="restartBtn">▶️ ЗАПУСТИТЬ</button>
                </div>
            `;
            showModal(html);
            
            document.getElementById('restartBtn').onclick = () => {
                state.mining_energy = 100;
                state.mining_lastTime = Date.now();
                alert('⛏️ Запущено!');
                save();
                update();
                openMining();
            };
        }

        // CASES
        function openCases() {
            let price = Math.floor(100 + state.cases_spins * 3.5);
            let html = `
                <h2>🎡 CASES</h2>
                <div class="info">
                    <div>#${state.cases_spins + 1}</div>
                    <div>${fmt(price)} TFY</div>
                    <button class="btn" id="openBtn">🔓 ОТКРЫТЬ</button>
                </div>
                <div class="stat-grid">
                    <div class="stat">🟢 ${state.stickers_c}</div>
                    <div class="stat">🟡 ${state.stickers_g}</div>
                    <div class="stat">🟣 ${state.stickers_d}</div>
                    <div class="stat">🌈 ${state.stickers_p}</div>
                </div>
            `;
            showModal(html);
            
            document.getElementById('openBtn').onclick = () => {
                if(state.balance < price) { alert(`Нужно ${fmt(price)}`); return; }
                state.balance -= price;
                state.cases_spins++;
                
                let r = Math.random();
                let type;
                if(r < 0.68) { type = 'c'; alert('🟢'); state.stickers_c++; }
                else if(r < 0.92) { type = 'g'; alert('🟡'); state.stickers_g++; }
                else if(r < 0.98) { type = 'd'; alert('🟣'); state.stickers_d++; }
                else { type = 'p'; alert('🌈'); state.stickers_p++; }
                
                save();
                update();
                openCases();
            };
        }

        // DAILY
        function openDaily() {
            let now = Date.now();
            let canClaim = (now - state.daily_last) > 86400000;
            
            let html = canClaim ? `
                <h2>📦 ДЕЙЛИ</h2>
                <div class="info">
                    <div style="font-size:20px; color:#ffd700;">+${50 * state.streak} TFY</div>
                    <div>Стрик: ${state.streak}/30</div>
                    <button class="btn" id="claimBtn">✅ ПОЛУЧИТЬ</button>
                </div>
            ` : `
                <h2>📦 ДЕЙЛИ</h2>
                <div class="info">Доступно завтра</div>
            `;
            
            showModal(html);
            
            if(canClaim) {
                document.getElementById('claimBtn').onclick = () => {
                    state.balance += 50 * state.streak;
                    state.daily_last = Date.now();
                    state.streak = Math.min(state.streak + 1, 30);
                    state.farm_seeds = 1;
                    alert(`📦 +${50 * state.streak} TFY`);
                    save();
                    update();
                    closeModal();
                };
            }
        }

        // LEADERBOARD
        function openLeaderboard() {
            let leaders = [
                { name: '@crypto_king', score: 125000 },
                { name: '@weedlord', score: 87450 },
                { name: '@minerpro', score: 45230 },
                { name: '@you', score: state.balance }
            ].sort((a,b) => b.score - a.score);
            
            let html = '<h2>🏆 ЛИДЕРБОРД</h2><div class="lb-list">';
            let medals = ['🥇', '🥈', '🥉'];
            leaders.forEach((l, i) => {
                html += `<div class="lb-item"><span>${medals[i] || i+1}. ${l.name}</span><span>${fmt(l.score)}</span></div>`;
            });
            html += '</div>';
            
            showModal(html);
        }

        // SHOP
        function openShop() {
            let html = `
                <h2>🛒 МАГАЗИН</h2>
                <div class="stat-grid">
                    <div class="stat">🟡<br>5K TFY</div>
                    <div class="stat">💎<br>25K TFY</div>
                    <div class="stat">👑<br>100K TFY</div>
                    <div class="stat">🌈<br>500K TFY</div>
                </div>
            `;
            showModal(html);
        }

        // UTILS
        function fmt(n) {
            if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if(n >= 1000) return (n/1000).toFixed(1) + 'K';
            return Math.floor(n).toString();
        }

        // INIT
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        document.getElementById('minesCard').onclick = openMines;
        document.getElementById('farmCard').onclick = openFarm;
        document.getElementById('miningCard').onclick = openMining;
        document.getElementById('casesCard').onclick = openCases;
        document.getElementById('dailyBtn').onclick = openDaily;
        document.getElementById('lbBtn').onclick = openLeaderboard;
        document.getElementById('shopBtn').onclick = openShop;
        document.getElementById('closeBtn').onclick = closeModal;
        document.getElementById('modal').onclick = (e) => { if(e.target === this) closeModal(); };

        update();
    </script>
</body>
</html>
