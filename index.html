<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFY Casino - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .balance { font-size: 24px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .vip-status { font-size: 14px; opacity: 0.9; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.25);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .card-icon { font-size: 32px; margin-bottom: 10px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .card-value { font-size: 18px; color: #ffd700; }
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin: 8px 0;
            box-shadow: 0 4px 15px rgba(254,202,87,0.4);
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(254,202,87,0.6); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            color: #333;
            max-width: 350px;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin: 20px 0;
            max-height: 300px;
            overflow: auto;
        }
        .mine-tile {
            width: 45px;
            height: 45px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .mine-tile:hover:not(.opened):not(.bomb) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .mine-tile.opened { background: #f0f0f0 !important; color: #333; cursor: default; }
        .mine-tile.bomb { background: #ff4444 !important; animation: shake 0.5s; cursor: default; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            transition: width 0.3s ease;
        }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; font-size: 14px; }
        .leaderboard { max-height: 300px; overflow-y: auto; }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 14px;
        }
        .farm-plant {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: rgba(0,255,0,0.2);
            margin: 8px 0;
            border-radius: 10px;
            font-size: 14px;
        }
        .rarity-common { color: #90EE90; }
        .rarity-gold { color: #FFD700; }
        .rarity-diamond { color: #B9F2FF; }
        .rarity-prismatic { color: #FF69B4; animation: glow 2s infinite; }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 5px currentColor; }
            50% { text-shadow: 0 0 20px currentColor; }
        }
        h2 { margin-bottom: 20px; text-align: center; }
        .small-btn { padding: 8px 16px !important; font-size: 12px !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 TFY CASINO</h1>
            <div class="balance" id="balance">💎 1,000 TFY</div>
            <div class="vip-status" id="vipStatus">🟢 Бронза</div>
        </div>

        <div class="grid">
            <div class="card" onclick="showGame('mines')">
                <div class="card-icon">🧨</div>
                <div class="card-title">MINES</div>
                <div class="card-value" id="minesMult">x1.00</div>
            </div>
            <div class="card" onclick="showGame('farm')">
                <div class="card-icon">🌿</div>
                <div class="card-title">WEED FARM</div>
                <div class="card-value" id="farmIncome">0 TFY/день</div>
            </div>
            <div class="card" onclick="showGame('mining')">
                <div class="card-icon">⛏️</div>
                <div class="card-title">MINING</div>
                <div class="card-value" id="miningIncome">0.01 TFY/мин</div>
            </div>
            <div class="card" onclick="showGame('cases')">
                <div class="card-icon">🎡</div>
                <div class="card-title">NFT CASES</div>
                <div class="card-value" id="casePrice">100 TFY</div>
            </div>
        </div>

        <div class="card" style="grid-column: span 2;">
            <div class="card-title">📈 Пассивный доход</div>
            <div class="card-value" id="passiveIncome">89 TFY/день</div>
            <div class="progress-bar">
                <div class="progress-fill" id="energyBar" style="width: 87%"></div>
            </div>
        </div>

        <button class="btn" onclick="showGame('shop')" style="background: linear-gradient(45deg, #4facfe, #00f2fe);">🛒 NFT Магазин</button>
        <button class="btn" onclick="showGame('leaderboard')" style="background: linear-gradient(45deg, #43e97b, #38f9d7);">🏆 Лидерборд</button>
        <button class="btn" onclick="claimDaily()" style="background: linear-gradient(45deg, #fa709a, #fee140);">📦 Дейли бонус</button>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="gameContent"></div>
        </div>
    </div>

    <script>
        let gameData = {
            balance: 1000,
            mines: { opened: 0, bombs: 5, size: 25, multiplier: 1 },
            farm: { seeds: 1, plants: [], upgrades: { water: false, light: false } },
            mining: { rigs: [{ power: 0.01, energy: 100, lastUpdate: Date.now() }], upgrades: {} },
            cases: { spins: 0, stickers: { common: 0, gold: 0, diamond: 0, prismatic: 0 } },
            passiveIncome: 89,
            dailyStreak: 1,
            lastDaily: 0,
            vip: 'bronze'
        };

        let minesGrid = [];

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        function init() {
            loadData();
            updateUI();
            setInterval(updateGameLoop, 1000);
        }

        function updateGameLoop() {
            updateMining();
            updateUI();
        }

        function updateUI() {
            document.getElementById('balance').textContent = `💎 ${formatNumber(gameData.balance)} TFY`;
            document.getElementById('vipStatus').textContent = getVipStatus();
            document.getElementById('passiveIncome').textContent = `${calculatePassiveIncome()} TFY/день`;
            document.getElementById('minesMult').textContent = `x${gameData.mines.multiplier.toFixed(2)}`;
            document.getElementById('casePrice').textContent = `${formatNumber(getCasePrice())} TFY`;
            document.getElementById('energyBar').style.width = `${Math.max(0, gameData.mining.rigs[0].energy)}%`;
            document.getElementById('miningIncome').textContent = `${gameData.mining.rigs[0].power.toFixed(2)} TFY/мин`;
        }

        function showGame(game) {
            const content = document.getElementById('gameContent');
            document.getElementById('gameModal').style.display = 'block';
            
            switch(game) {
                case 'mines':
                    content.innerHTML = `
                        <h2>🧨 MINES</h2>
                        <div style="text-align: center; margin-bottom: 20px;">
                            Мины: ${gameData.mines.bombs}/${gameData.mines.size} | 
                            Множитель: x${gameData.mines.multiplier.toFixed(2)}
                        </div>
                        <div class="mines-grid" id="minesGrid"></div>
                        <div style="margin-top: 20px;">
                            <button class="btn" onclick="playMines()">Открыть клетку (-25 TFY)</button><br>
                            <button class="btn" onclick="cashOutMines()">💰 Cash Out (+${Math.floor(gameData.mines.multiplier * 25)} TFY)</button>
                        </div>
                    `;
                    createMinesGrid();
                    break;
                    
                case 'farm':
                    updateFarmUI();
                    content.innerHTML = `
                        <h2>🌿 WEED FARM</h2>
                        <div style="text-align: center; margin-bottom: 20px;">
                            Семечек: ${gameData.farm.seeds}/1 
                            <button class="btn small-btn" onclick="claimSeed()" ${gameData.farm.seeds >= 1 ? 'disabled' : ''}>📦 Получить</button>
                        </div>
                        <div id="farmPlants"></div>
                        <div style="margin-top: 20px;">
                            <div class="stats-grid">
                                <div>💧 Полив<br><span style="color: gold;">750 TFY</span></div>
                                <div>☀️ Свет<br><span style="color: gold;">2.25K TFY</span></div>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'mining':
                    content.innerHTML = `
                        <h2>⛏️ MINING TYCOON</h2>
                        <div style="text-align: center;">
                            <div>RIG #1: ${gameData.mining.rigs[0].power.toFixed(2)} TFY/мин</div>
                            <div>Энергия: ${gameData.mining.rigs[0].energy.toFixed(0)}%</div>
                            <button class="btn" onclick="startMining()" ${gameData.mining.rigs[0].energy >= 95 ? 'disabled' : ''}>▶️ Запустить</button>
                        </div>
                        <div style="margin-top: 20px;">
                            <div class="stats-grid">
                                <div>💻 GPU<br><span style="color: gold;">3.75K TFY</span></div>
                                <div>❄️ Водянка<br><span style="color: gold;">12K TFY</span></div>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'cases':
                    content.innerHTML = `
                        <h2>🎡 NFT CASES</h2>
                        <div style="text-align: center;">
                            <div>Прокрутка #${gameData.cases.spins + 1}</div>
                            <div style="font-size: 16px; margin: 10px 0;">${formatNumber(getCasePrice())} TFY</div>
                            <div style="font-size: 12px; opacity: 0.8;">🟢68% 🟡24% 🟣6% 🌈2%</div>
                            <div style="font-size: 48px; margin: 20px 0;">🎡</div>
                            <button class="btn" onclick="openCase()">🔓 ОТКРЫТЬ КЕЙС</button>
                        </div>
                        <div style="margin-top: 20px;">
                            <div class="stats-grid">
                                <div>🟢 ${gameData.cases.stickers.common}</div>
                                <div>🟡 ${gameData.cases.stickers.gold}</div>
                                <div>🟣 ${gameData.cases.stickers.diamond}</div>
                                <div>🌈 ${gameData.cases.stickers.prismatic}</div>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'shop':
                    content.innerHTML = `
                        <h2>🛒 NFT МАГАЗИН</h2>
                        <div style="text-align: center;">
                            <div class="stats-grid">
                                <div>🟡 Золотой PM<br><span style="color: gold;">5K TFY</span></div>
                                <div>💎 Брилл. Косяк<br><span style="color: gold;">25K TFY</span></div>
                                <div>👑 Королевский Риг<br><span style="color: gold;">100K TFY</span></div>
                                <div>🌈 Легенда<br><span style="color: gold;">500K TFY</span></div>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'leaderboard':
                    content.innerHTML = `
                        <h2>🏆 ЛИДЕРБОРД</h2>
                        <div class="leaderboard" id="leaderboardList"></div>
                    `;
                    showLeaderboard();
                    break;
            }
        }

        function createMinesGrid() {
            const grid = document.getElementById('minesGrid');
            minesGrid = [];
            grid.innerHTML = '';
            for(let i = 0; i < gameData.mines.size; i++) {
                const tile = document.createElement('div');
                tile.className = 'mine-tile';
                tile.dataset.index = i;
                tile.onclick = () => openMineTile(parseInt(tile.dataset.index));
                grid.appendChild(tile);
                minesGrid.push(false);
            }
        }

        function openMineTile(index) {
            if(gameData.balance < 25) {
                alert('💸 Недостаточно TFY! Нужно 25');
                return;
            }
            
            gameData.balance -= 25;
            gameData.mines.opened++;
            gameData.mines.multiplier = 1 + (gameData.mines.opened * 0.15);
            
            const tile = document.querySelector(`[data-index="${index}"]`);
            const isBomb = Math.random() < (gameData.mines.bombs / (gameData.mines.size - gameData.mines.opened));
            
            if(isBomb || minesGrid[index]) {
                tile.className = 'mine-tile bomb';
                tile.textContent = '💣';
                gameData.mines = { opened: 0, bombs: 5, size: 25, multiplier: 1 };
                alert('💥 БАМ! Попалась мина!');
            } else {
                tile.className = 'mine-tile opened';
                tile.textContent = '💎';
                minesGrid[index] = true;
                
                if(Math.random() < 0.02) {
                    alert('🎫 +1 КАРТА СОКРОВИЩ!');
                }
            }
            saveData();
            updateUI();
        }

        function cashOutMines() {
            if(gameData.mines.opened === 0) return;
            const win = Math.floor(gameData.mines.multiplier * 25);
            gameData.balance += win;
            alert(`💰 ВЫИГРЫШ: +${win} TFY! (x${gameData.mines.multiplier.toFixed(2)})`);
            gameData.mines = { opened: 0, bombs: 5, size: 25, multiplier: 1 };
            closeModal();
            saveData();
            updateUI();
        }

        function getCasePrice() {
            return Math.floor(100 + (gameData.cases.spins * 3.5));
        }

        function openCase() {
            const price = getCasePrice();
            if(gameData.balance < price) {
                alert(`💸 Нужно ${formatNumber(price)} TFY!`);
                return;
            }
            
            gameData.balance -= price;
            gameData.cases.spins++;
            
            const rand = Math.random();
            let rarity;
            
            if(rand < 0.68) rarity = 'common';
            else if(rand < 0.92) rarity = 'gold';
            else if(rand < 0.98) rarity = 'diamond';
            else rarity = 'prismatic';
            
            gameData.cases.stickers[rarity]++;
            alert(`🎉 ${getRarityName(rarity).toUpperCase()} НАКЛЕЙКА! +${getStickerBonus(rarity)}% бонус`);
            saveData();
            updateUI();
        }

        function getRarityName(rarity) {
            const names = {
                common: '🟢 Обычная',
                gold: '🟡 Золотая', 
                diamond: '🟣 Бриллиантовая',
                prismatic: '🌈 Призматическая'
            };
            return names[rarity];
        }

        function getStickerBonus(rarity) {
            const bonuses = { common: 1, gold: 5, diamond: 25, prismatic: 100 };
            return bonuses[rarity];
        }

        function claimDaily() {
            const now = Date.now();
            if(now - gameData.lastDaily < 86400000) {
                alert('⏰ Дейли доступен раз в 24 часа!');
                return;
            }
            
            const bonus = 50 * gameData.dailyStreak;
            gameData.balance += bonus;
            gameData.lastDaily = now;
            gameData.dailyStreak = Math.min(gameData.dailyStreak + 1, 30);
            gameData.farm.seeds = 1;
            
            alert(`📦 ДЕЙЛИ БОНУС!\n+${bonus} TFY\nСтрик: ${gameData.dailyStreak}/30`);
            saveData();
            updateUI();
        }

        function claimSeed() {
            gameData.farm.seeds = 1;
            alert('🌱 Семечко получено!');
            saveData();
            updateFarmUI();
        }

        function updateFarmUI() {
            const plantsDiv = document.getElementById('farmPlants');
            plantsDiv.innerHTML = gameData.farm.plants.length ? 
                gameData.farm.plants.map((plant, index) => `
                    <div class="farm-plant">
                        <span>${plant.emoji}</span>
                        <span>${plant.name} → ${plant.income} TFY</span>
                        <button class="btn small-btn" onclick="collectPlant(${index})">Собрать</button>
                    </div>
                `).join('') : '<div style="text-align:center; opacity:0.7;">Нет растений<br>Посади семечко!</div>';
        }

        function collectPlant(index) {
            const plant = gameData.farm.plants[index];
            gameData.balance += plant.income;
            gameData.farm.plants.splice(index, 1);
            alert(`🌿 Собран урожай: +${plant.income} TFY`);
            saveData();
            updateFarmUI();
            updateUI();
        }

        function startMining() {
            if(gameData.mining.rigs[0].energy >= 95) {
                alert('⚡ Энергия почти полная!');
                return;
            }
            gameData.mining.rigs[0].energy = 100;
            gameData.mining.rigs[0].lastUpdate = Date.now();
            alert('⛏️ Майнинг запущен!');
            saveData();
            updateUI();
        }

        function updateMining() {
            const rig = gameData.mining.rigs[0];
            const now = Date.now();
            const elapsed = (now - rig.lastUpdate) / 1000 / 60; // minutes
            rig.energy = Math.max(0, rig.energy - elapsed * 0.139); // 12h full drain
            if(rig.energy > 0) {
                gameData.balance += rig.power * elapsed;
            }
            rig.lastUpdate = now;
            saveData();
        }

        function calculatePassiveIncome() {
            let income = 0;
            gameData.farm.plants.forEach(p => income += p.income);
            income += gameData.mining.rigs[0].power * 60 * 24;
            return Math.floor(income);
        }

        function showLeaderboard() {
            const list = document.getElementById('leaderboardList');
            const demoData = [
                { name: '@crypto_king', score: 125000, vip: '🌈' },
                { name: '@weedlord', score: 87450, vip: '🟣' },
                { name: '@minerpro', score: 45230, vip: '🟡' },
                { name: '@lazylucker', score: gameData.balance, vip: getVipStatus().slice(0,2) }
            ];
            list.innerHTML = demoData.map((player, i) => `
                <div class="leaderboard-item">
                    <span>${['🥇','🥈','🥉','4️⃣'][i]} ${player.name} ${player.vip}</span>
                    <span>${formatNumber(player.score)} TFY</span>
                </div>
            `).join('');
        }

        function formatNumber(num) {
            if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
            if(num >= 1000) return (num/1000).toFixed(1) + 'K';
            return Math.floor(num).toString();
        }

        function getVipStatus() {
            const stickers = Object.values(gameData.cases.stickers).reduce((a,b)=>a+b,0);
            if(stickers >= 50) return '🌈 Легенда';
            if(stickers >= 20) return '🟣 Платина';
            if(stickers >= 5) return '🟡 Золото';
            return '🟢 Бронза';
        }

        function saveData() { 
            localStorage.setItem('tfyCasino', JSON.stringify(gameData)); 
        }

        function loadData() {
            try {
                const saved = localStorage.getItem('tfyCasino');
                if(saved) {
                    const loaded = JSON.parse(saved);
                    gameData = { ...gameData, ...loaded };
                    gameData.mining.rigs[0].lastUpdate = loaded.mining?.rigs?.[0]?.lastUpdate || Date.now();
                }
            } catch(e) {
                console.log('Load error, using defaults');
            }
        }

        function closeModal() { 
            document.getElementById('gameModal').style.display = 'none'; 
        }

        init();
    </script>
</body>
</html>
