<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFY Casino Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; min-height: 100vh;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 15px; }
        .header {
            text-align: center; margin-bottom: 20px;
            background: rgba(255,255,255,0.1); padding: 20px;
            border-radius: 20px; backdrop-filter: blur(10px);
        }
        .balance { font-size: 26px; font-weight: bold; margin: 10px 0; color: #ffd700; }
        .vip { font-size: 13px; opacity: 0.9; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .card {
            background: rgba(255,255,255,0.12); padding: 18px;
            border-radius: 15px; text-align: center; cursor: pointer;
            transition: all 0.3s; border: 1px solid rgba(255,255,255,0.2);
        }
        .card:active { transform: scale(0.95); }
        .icon { font-size: 32px; margin-bottom: 8px; }
        .title { font-size: 13px; font-weight: bold; }
        .value { font-size: 16px; color: #ffd700; margin-top: 5px; }
        .btn {
            width: 100%; padding: 12px; border: none;
            border-radius: 20px; color: white; font-weight: bold;
            cursor: pointer; font-size: 13px; margin: 8px 0;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
        }
        .modal-content {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30,30,40,0.95);
            border-radius: 20px; padding: 25px;
            max-width: 360px; max-height: 85%;
            overflow-y: auto; color: white;
        }
        .close { position: absolute; top: 10px; right: 15px; font-size: 28px; cursor: pointer; color: #999; }
        h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
        .mines-grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 4px; margin: 15px 0;
        }
        .tile {
            width: 50px; height: 50px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 8px; display: flex;
            align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer;
            border: 2px solid rgba(255,255,255,0.3);
            user-select: none;
        }
        .tile:active { transform: scale(0.95); }
        .tile.locked { opacity: 0.5; cursor: default; }
        .tile.treasure { background: #ffd700; color: #333; font-weight: bold; }
        .tile.bomb { background: #ff4444; animation: boom 0.5s; }
        @keyframes boom { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .progress { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; font-size: 12px; }
        .stat-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; text-align: center; }
        .leaderboard { max-height: 300px; overflow-y: auto; }
        .lb-item {
            display: flex; justify-content: space-between;
            padding: 10px; background: rgba(255,255,255,0.08);
            margin-bottom: 5px; border-radius: 8px; font-size: 13px;
        }
        .farm-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; background: rgba(0,255,100,0.15);
            margin: 8px 0; border-radius: 8px; font-size: 12px;
        }
        .farm-btn { padding: 6px 12px; font-size: 11px !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 TFY CASINO</h1>
            <div class="balance" id="balance">💎 1,000 TFY</div>
            <div class="vip" id="vip">🟢 Бронза</div>
        </div>

        <div class="grid">
            <div class="card" onclick="openMines()">
                <div class="icon">🧨</div>
                <div class="title">MINES</div>
                <div class="value" id="minesMult">x1.00</div>
            </div>
            <div class="card" onclick="openFarm()">
                <div class="icon">🌿</div>
                <div class="title">WEED FARM</div>
                <div class="value" id="farmInc">0 TFY</div>
            </div>
            <div class="card" onclick="openMining()">
                <div class="icon">⛏️</div>
                <div class="title">MINING</div>
                <div class="value" id="mineRate">0.01 TFY</div>
            </div>
            <div class="card" onclick="openCases()">
                <div class="icon">🎡</div>
                <div class="title">NFT CASES</div>
                <div class="value" id="casePrice">100 TFY</div>
            </div>
        </div>

        <button class="btn" onclick="openDaily()">📦 ДЕЙЛИ БОНУС</button>
        <button class="btn" onclick="openLeaderboard()">🏆 ЛИДЕРБОРД</button>
        <button class="btn" onclick="openShop()">🛒 МАГАЗИН</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="content"></div>
        </div>
    </div>

    <script>
        let game = {
            balance: 1000,
            mines: { opened: 0, mult: 1, locked: false },
            farm: { seeds: 1, plants: [], harvest: 0 },
            mining: { power: 0.01, energy: 100, lastTime: Date.now() },
            cases: { spins: 0, stickers: { c: 0, g: 0, d: 0, p: 0 } },
            daily: 0,
            streak: 1,
            vip: '🟢 Бронза'
        };

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        setInterval(() => {
            let now = Date.now();
            let mins = (now - game.mining.lastTime) / 60000;
            game.balance += game.mining.power * mins;
            game.mining.lastTime = now;
            save();
            update();
        }, 1000);

        load();
        update();

        function update() {
            document.getElementById('balance').textContent = `💎 ${fmt(game.balance)} TFY`;
            document.getElementById('minesMult').textContent = `x${game.mines.mult.toFixed(2)}`;
            document.getElementById('casePrice').textContent = `${fmt(100 + game.cases.spins * 3.5)} TFY`;
            let total = game.farm.plants.reduce((a,p) => a + p.gain, 0) + game.mining.power * 1440;
            document.getElementById('farmInc').textContent = `${fmt(total)} TFY`;
            document.getElementById('mineRate').textContent = `${game.mining.power.toFixed(2)} TFY`;
            
            let stickers = game.cases.stickers.c + game.cases.stickers.g + game.cases.stickers.d + game.cases.stickers.p;
            if(stickers >= 50) game.vip = '🌈 Легенда';
            else if(stickers >= 20) game.vip = '🟣 Платина';
            else if(stickers >= 5) game.vip = '🟡 Золото';
            else game.vip = '🟢 Бронза';
            document.getElementById('vip').textContent = game.vip;
        }

        function openMines() {
            let html = `<h2>🧨 MINES</h2>
                <div style="text-align:center; margin-bottom:15px;">
                    Множитель: x${game.mines.mult.toFixed(2)} | Открыто: ${game.mines.opened}/25
                </div>
                <div class="mines-grid" id="grid"></div>
                <button class="btn" onclick="playMine()" ${game.mines.locked ? 'disabled' : ''}>ОТКРЫТЬ (-25 TFY)</button>
                <button class="btn" onclick="cashOut()" ${game.mines.opened === 0 ? 'disabled' : ''}>💰 CASH OUT (+${Math.floor(game.mines.mult * 25)} TFY)</button>
            `;
            show(html);
            makeMineGrid();
        }

        function makeMineGrid() {
            let grid = document.getElementById('grid');
            grid.innerHTML = '';
            for(let i = 0; i < 25; i++) {
                let t = document.createElement('div');
                t.className = 'tile ' + (game.mines.opened > i ? 'locked' : '');
                t.textContent = i < game.mines.opened ? '💎' : '?';
                grid.appendChild(t);
            }
        }

        function playMine() {
            if(game.balance < 25) { alert('Нужно 25 TFY'); return; }
            if(game.mines.locked) { alert('Уже открыта!'); return; }
            
            game.balance -= 25;
            game.mines.opened++;
            game.mines.mult = 1 + (game.mines.opened * 0.15);

            let isBomb = Math.random() < 0.25;
            
            if(isBomb) {
                let tiles = document.querySelectorAll('.tile');
                tiles[game.mines.opened - 1].className = 'tile bomb';
                tiles[game.mines.opened - 1].textContent = '💣';
                alert('💥 ПОПАЛАСЬ МИНА!');
                game.mines = { opened: 0, mult: 1, locked: false };
            } else {
                game.mines.locked = true;
                let tiles = document.querySelectorAll('.tile');
                tiles[game.mines.opened - 1].className = 'tile treasure';
                tiles[game.mines.opened - 1].textContent = '💎';
                if(Math.random() < 0.02) alert('🎫 +КАРТА СОКРОВИЩ!');
            }
            save();
            update();
            openMines();
        }

        function cashOut() {
            if(game.mines.opened === 0) return;
            let win = Math.floor(game.mines.mult * 25);
            game.balance += win;
            alert(`💰 +${win} TFY!`);
            game.mines = { opened: 0, mult: 1, locked: false };
            save();
            update();
            closeModal();
        }

        function openFarm() {
            let plants = game.farm.plants.map((p, i) => 
                `<div class="farm-item">
                    <span>${p.emoji} ${p.name}: +${p.gain} TFY</span>
                    <button class="btn farm-btn" onclick="harvest(${i})">Собрать</button>
                </div>`
            ).join('');

            let html = `<h2>🌿 WEED FARM</h2>
                <div style="text-align:center; margin-bottom:15px;">
                    Семечек: ${game.farm.seeds}/1
                    <button class="btn farm-btn" onclick="plantSeed()" ${game.farm.seeds < 1 ? 'disabled' : ''}>Посадить</button>
                </div>
                <div>${plants || '<div style="text-align:center; opacity:0.7;">Нет растений</div>'}</div>
            `;
            show(html);
        }

        function plantSeed() {
            if(game.farm.seeds < 1) return;
            game.farm.seeds = 0;
            game.farm.plants.push({ emoji: '🌿', name: 'Кустик', gain: 50 });
            alert('🌱 Посажено!');
            save();
            update();
            openFarm();
        }

        function harvest(i) {
            game.balance += game.farm.plants[i].gain;
            game.farm.plants.splice(i, 1);
            game.farm.seeds = 1;
            alert(`✅ +${game.farm.plants[i]?.gain || 50} TFY`);
            save();
            update();
            openFarm();
        }

        function openMining() {
            let html = `<h2>⛏️ MINING</h2>
                <div style="text-align:center;">
                    <div style="margin:15px 0;">RIG: ${game.mining.power.toFixed(2)} TFY/мин</div>
                    <div>Энергия: ${game.mining.energy.toFixed(0)}%</div>
                    <div class="progress"><div class="progress-bar" style="width:${game.mining.energy}%"></div></div>
                    <button class="btn" onclick="restartMine()">▶️ ЗАПУСТИТЬ</button>
                </div>
                <div class="stats">
                    <div class="stat-item">💻 GPU<br>3.75K TFY</div>
                    <div class="stat-item">❄️ Водянка<br>12K TFY</div>
                </div>
            `;
            show(html);
        }

        function restartMine() {
            game.mining.energy = 100;
            alert('⛏️ Запущено!');
            save();
            update();
        }

        function openCases() {
            let html = `<h2>🎡 NFT CASES</h2>
                <div style="text-align:center;">
                    <div style="margin:10px 0;">Цена: ${fmt(100 + game.cases.spins * 3.5)} TFY</div>
                    <div style="font-size:12px; opacity:0.8;">🟢68% 🟡24% 🟣6% 🌈2%</div>
                    <div style="font-size:48px; margin:20px 0; animation: spin 2s linear infinite;">🎡</div>
                    <button class="btn" onclick="openCase()">🔓 ОТКРЫТЬ</button>
                </div>
                <div class="stats">
                    <div class="stat-item">🟢 ${game.cases.stickers.c}</div>
                    <div class="stat-item">🟡 ${game.cases.stickers.g}</div>
                    <div class="stat-item">🟣 ${game.cases.stickers.d}</div>
                    <div class="stat-item">🌈 ${game.cases.stickers.p}</div>
                </div>
            `;
            show(html);
        }

        function openCase() {
            let price = 100 + game.cases.spins * 3.5;
            if(game.balance < price) { alert(`Нужно ${fmt(price)} TFY`); return; }
            
            game.balance -= price;
            game.cases.spins++;
            
            let r = Math.random();
            let type;
            if(r < 0.68) type = 'c';
            else if(r < 0.92) type = 'g';
            else if(r < 0.98) type = 'd';
            else type = 'p';
            
            game.cases.stickers[type]++;
            let names = { c: '🟢 Обычная', g: '🟡 Золотая', d: '🟣 Брилл', p: '🌈 Легенда' };
            alert(`🎉 ${names[type]}!`);
            save();
            update();
            openCases();
        }

        function openDaily() {
            let now = Date.now();
            let canClaim = (now - game.daily) > 86400000;
            
            let html = `<h2>📦 ДЕЙЛИ</h2>
                <div style="text-align:center; margin:20px 0;">
                    ${canClaim ? `
                        <button class="btn" onclick="claimDaily()">✅ ПОЛУЧИТЬ</button>
                        <div style="margin-top:15px; font-size:14px;">
                            +${50 * game.streak} TFY<br>
                            Стрик: ${game.streak}/30
                        </div>
                    ` : `
                        <div style="opacity:0.7;">Доступно завтра</div>
                    `}
                </div>
            `;
            show(html);
        }

        function claimDaily() {
            game.balance += 50 * game.streak;
            game.daily = Date.now();
            game.streak = Math.min(game.streak + 1, 30);
            game.farm.seeds = 1;
            alert(`📦 +${50 * game.streak} TFY!`);
            save();
            update();
            closeModal();
        }

        function openLeaderboard() {
            let leaders = [
                { name: '@crypto_king', score: 125000 },
                { name: '@weedlord', score: 87450 },
                { name: '@minerpro', score: 45230 },
                { name: '@ты', score: Math.floor(game.balance) }
            ].sort((a,b) => b.score - a.score);
            
            let html = `<h2>🏆 ЛИДЕРБОРД</h2><div class="leaderboard">`;
            let medals = ['🥇', '🥈', '🥉'];
            leaders.forEach((l, i) => {
                html += `<div class="lb-item"><span>${medals[i] || (i+1)+'.'} ${l.name}</span><span>${fmt(l.score)} TFY</span></div>`;
            });
            html += '</div>';
            show(html);
        }

        function openShop() {
            let html = `<h2>🛒 МАГАЗИН</h2>
                <div class="stats">
                    <div class="stat-item">🟡 PM<br>5K TFY</div>
                    <div class="stat-item">💎 Косяк<br>25K TFY</div>
                    <div class="stat-item">👑 Риг<br>100K TFY</div>
                    <div class="stat-item">🌈 Легенда<br>500K TFY</div>
                </div>
            `;
            show(html);
        }

        function show(html) {
            document.getElementById('content').innerHTML = html;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function fmt(n) {
            if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if(n >= 1000) return (n/1000).toFixed(1) + 'K';
            return Math.floor(n).toString();
        }

        function save() {
            localStorage.setItem('tfy', JSON.stringify(game));
        }

        function load() {
            let saved = localStorage.getItem('tfy');
            if(saved) game = JSON.parse(saved);
            game.mining.lastTime = Date.now();
        }
    </script>
</body>
</html>
